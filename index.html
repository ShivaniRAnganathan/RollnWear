  <!-- Relative links work at the domain root and in a subfolder. -->
  <script>
    (function () {
      var path = location.pathname;
      if (!path.endsWith("/")) {
        var slash = path.lastIndexOf("/");
        var last = path.slice(slash + 1);
        if (last.indexOf(".") !== -1) path = path.slice(0, slash + 1);
        else path += "/";
      }
      var base = document.createElement("base");
      base.href = location.origin + path;
      document.head.appendChild(base);
    })();
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Brand",
    "name": "Roll & Wear",
    "url": "https://rollnwear.pages.dev/",
    "logo": "https://rollnwear.pages.dev/images/logo-circle.png",
    "description": "Original board-game tees, made by gamers for gamers.",
    "sameAs": ["https://www.instagram.com/rollnwear/"]
  }
  </script>
</head>
<body id="top">
  <a class="skip" href="#tees">Skip to the tees</a>
  <header class="site-header">
    <a class="brand" href="#top">
      <img src="images/logo-circle.png" width="48" height="48" alt="Roll &amp; Wear">
    </a>
    <nav>
      <a href="#tees">Tees</a>
      <a href="#order">Order</a>
    </nav>
  </header>
  <main>
    <section class="hero" aria-labelledby="hero-headline">
      <div class="wrap hero-inner">
        <p class="kicker">
          <svg class="kicker-die" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="4" y="4" width="56" height="56" rx="14" fill="#E5C05E"></rect>
            <circle cx="20" cy="20" r="5" fill="#3F3073"></circle>
            <circle cx="44" cy="20" r="5" fill="#3F3073"></circle>
            <circle cx="32" cy="32" r="5" fill="#3F3073"></circle>
            <circle cx="20" cy="44" r="5" fill="#3F3073"></circle>
            <circle cx="44" cy="44" r="5" fill="#3F3073"></circle>
          </svg>
          <span id="hero-kicker"></span>
        </p>
        <h1 id="hero-headline"></h1>
        <p class="lede" id="hero-sub"></p>
        <a class="pill" id="hero-ig" href="https://www.instagram.com/rollnwear/">Instagram @rollnwear</a>
      </div>
      <svg class="deco deco-die" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="4" y="4" width="56" height="56" rx="14" fill="currentColor"></rect>
        <circle cx="22" cy="22" r="5" fill="#3F3073"></circle>
        <circle cx="42" cy="42" r="5" fill="#3F3073"></circle>
      </svg>
      <svg class="deco deco-meeple" viewBox="0 0 64 86" aria-hidden="true">
        <path fill="currentColor" d="M32 3c7.2 0 13 5.6 13 12.8 0 4.1-1.9 7.2-4.4 9.8 8.8 3.7 14.9 12.2 14.9 22.2v23.4c0 2.2-1.9 3.9-4.1 3.4l-8.2-2.4-3.2 8.2c-.6 1.5-2.1 2.6-3.8 2.6H27.8c-1.7 0-3.2-1.1-3.8-2.6l-3.2-8.2-8.2 2.4c-2.2.5-4.1-1.2-4.1-3.4V47.8c0-10 6.1-18.5 14.9-22.2-2.5-2.6-4.4-5.7-4.4-9.8C19 8.6 24.8 3 32 3z"></path>
      </svg>
    </section>

    <section class="about">
      <div class="wrap">
        <article class="about-card">
          <p class="about-kicker" id="about-kicker"></p>
          <h2 id="about-heading"></h2>
          <p id="about-body"></p>
          <a id="about-link" href="https://www.instagram.com/rollnwear/">Instagram @rollnwear</a>
        </article>
      </div>
    </section>

    <section class="tees" id="tees">
      <div class="wrap">
        <div class="section-head">
          <h2 id="tees-heading"></h2>
          <p id="tees-intro"></p>
        </div>
        <div class="catalog" id="catalog">
          <p class="catalog-message" id="catalog-loading">Loading the tees…</p>
        </div>
      </div>
    </section>

    <section class="order" id="order">
      <div class="wrap">
        <div class="order-card">
          <h2 id="order-heading"></h2>
          <p id="order-intro"></p>
          <p class="ordering-note" id="ordering-note" hidden></p>
          <form id="order-form" novalidate>
            <div id="form-alert" class="form-alert" role="alert" hidden></div>
            <div class="field">
              <label id="label-name" for="buyer-name">Name</label>
              <input id="buyer-name" name="name" autocomplete="name" required>
              <p class="field-error" id="error-name" hidden></p>
            </div>
            <div class="field">
              <label id="label-design" for="design">Design and colour</label>
              <select id="design" name="design" required>
                <option value="">Choose a tee</option>
              </select>
              <p class="field-error" id="error-design" hidden></p>
            </div>
            <div class="field">
              <label id="label-size">Size</label>
              <div id="size-group" class="size-group" role="radiogroup" aria-labelledby="label-size" tabindex="-1"></div>
              <p class="size-hint" id="size-hint">Choose a design to see sizes.</p>
              <p class="field-error" id="error-size" hidden></p>
            </div>
            <div class="field">
              <label id="label-quantity" for="quantity">Quantity</label>
              <input id="quantity" name="quantity" type="number" inputmode="numeric" min="1" max="10" step="1" value="1" required>
              <p class="field-error" id="error-quantity" hidden></p>
            </div>
            <div class="field">
              <label id="label-city" for="city">City</label>
              <input id="city" name="city" autocomplete="address-level2" required>
              <p class="field-error" id="error-city" hidden></p>
            </div>
            <div class="field">
              <label id="label-pincode" for="pincode">Pincode</label>
              <input id="pincode" name="pincode" inputmode="numeric" autocomplete="postal-code" maxlength="6" required>
              <p class="field-error" id="error-pincode" hidden></p>
            </div>
            <div class="field">
              <label id="label-source" for="source">Where did you hear about us?</label>
              <select id="source" name="source" required>
                <option value="">Choose one</option>
              </select>
              <p class="field-error" id="error-source" hidden></p>
            </div>
            <div class="field">
              <label id="label-note" for="note">Note (optional)</label>
              <textarea id="note" name="note"></textarea>
              <p class="field-error" id="error-note" hidden></p>
            </div>
            <p class="each-price" id="each-price"></p>
            <div class="total-bar">
              <span id="total-label">Total</span>
              <strong id="order-total">Rs —</strong>
            </div>
            <button class="submit" type="submit"><span id="submit-label">Send order on WhatsApp</span></button>
            <p class="sent-note" id="sent-note" hidden></p>
            <a class="fallback" id="wa-fallback" hidden rel="noopener noreferrer" target="_blank">Open WhatsApp with this order</a>
          </form>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p id="footer-copy"></p>
      <a id="footer-ig" href="https://www.instagram.com/rollnwear/">Instagram @rollnwear</a>
    </div>
  </footer>
  <a class="wa-float" id="chat-link" href="https://wa.me/918500000811" rel="noopener noreferrer" target="_blank">

    </svg>
    <span id="chat-label">Chat on WhatsApp</span>
  </a>
  <noscript>
    <p class="catalog-message wrap">This shop needs JavaScript to show the tees and to open WhatsApp.</p>
  </noscript>
  <script src="content.js"></script>
  <script src="shop.js"></script>
  <script src="app.js"></script>
</body>
</html>
