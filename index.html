  <script>
    (function () {
      var path = location.pathname;
      if (!path.endsWith("/")) {
        var slash = path.lastIndexOf("/");
        var last = path.slice(slash + 1);
        if (last.indexOf(".") !== -1) path = path.slice(0, slash + 1);
        else path += "/";
      }
      var base = document.createElement("base");
      base.href = location.origin + path;
      document.head.appendChild(base);
    })();
  </script>

  {
    "@context": "https://schema.org",
    "@type": "Brand",
    "name": "Roll & Wear",
    "url": "https://rollnwear.pages.dev/",
    "logo": "https://rollnwear.pages.dev/images/logo-circle.png",

<body id="top">
  <a class="skip" href="#tees">Skip to the tees</a>
  <header class="site-header">
    <a class="brand" href="#top">
      <img src="images/logo-circle.png" width="42" height="42" alt="Roll &amp; Wear">
    </a>
    <nav>
      <a href="#tees">Tees</a>
      <a href="#order">Order</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <div class="wrap">
        <p class="kicker" id="hero-kicker"></p>
        <h1 id="hero-headline"></h1>
        <p class="lede" id="hero-sub"></p>
        <a class="text-link" id="hero-ig" href="https://www.instagram.com/rollnwear/">Instagram @rollnwear</a>
      </div>
    </section>
    <section class="about">
      <div class="wrap">
        <h2 id="about-heading"></h2>
        <p id="about-body"></p>
      </div>
    </section>
    <section class="how" id="how">
      <div class="wrap">
        <h2 id="how-heading"></h2>
        <ol class="steps" id="how-steps"></ol>
      </div>
    </section>
    <section class="tees" id="tees">
      <div class="wrap">
        <h2 id="tees-heading"></h2>
        <p class="section-intro" id="tees-intro"></p>
        <div class="catalog" id="catalog">
          <p class="catalog-message">Loading the tees…</p>
        </div>
      </div>
    </section>
    <section class="order" id="order">
      <div class="wrap">
        <div class="order-panel">
          <h2 id="order-heading"></h2>
          <p id="order-intro"></p>
          <form id="order-form" novalidate>
            <div id="form-alert" class="form-alert" role="alert" hidden></div>
            <div class="field">
              <label id="label-name" for="buyer-name">Name</label>
              <input id="buyer-name" name="name" autocomplete="name" required>
              <p class="field-error" id="error-name" hidden></p>
            </div>
            <div class="field">
              <label id="label-design" for="design">Design and colour</label>
              <select id="design" name="design" required>
                <option value="">Choose a tee</option>
              </select>
              <p class="field-error" id="error-design" hidden></p>
            </div>
            <div class="field">
              <p class="size-label" id="label-size">Size</p>
              <div id="size-group" class="size-group" role="radiogroup" aria-labelledby="label-size" tabindex="-1"></div>
              <p class="size-hint" id="size-hint">Choose a tee to see sizes.</p>
              <p class="field-error" id="error-size" hidden></p>
            </div>
            <div class="field">
              <label id="label-quantity" for="quantity">Quantity</label>
              <input id="quantity" name="quantity" type="number" inputmode="numeric" min="1" max="10" step="1" value="1" required>
              <p class="field-error" id="error-quantity" hidden></p>
            </div>
            <div class="field">
              <label id="label-city" for="city">City</label>
              <input id="city" name="city" autocomplete="address-level2" required>
              <p class="field-error" id="error-city" hidden></p>
            </div>
            <div class="field">
              <label id="label-pincode" for="pincode">Pincode</label>
              <input id="pincode" name="pincode" inputmode="numeric" autocomplete="postal-code" maxlength="6" required>
              <p class="field-error" id="error-pincode" hidden></p>
            </div>
            <div class="field">
              <label id="label-source" for="source">Where did you hear about us?</label>
              <select id="source" name="source" required>
                <option value="">Choose one</option>
              </select>
              <p class="field-error" id="error-source" hidden></p>
            </div>
            <div class="field">
              <label id="label-note" for="note">Note (optional)</label>
              <textarea id="note" name="note"></textarea>
              <p class="field-error" id="error-note" hidden></p>
            </div>
            <p class="each-price" id="each-price"></p>
            <div class="total-bar">
              <span id="total-label">Total</span>
              <strong id="order-total">₹—</strong>
            </div>
            <button class="btn" type="submit" id="submit-label">Send order on WhatsApp</button>
            <p class="sent-note" id="sent-note" hidden></p>
            <a class="fallback" id="wa-fallback" hidden rel="noopener noreferrer" target="_blank">Open WhatsApp with this order</a>
          </form>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p id="footer-copy"></p>
      <a id="footer-ig" href="https://www.instagram.com/rollnwear/">Instagram @rollnwear</a>
    </div>
  </footer>
  <a class="wa-float" id="chat-link" href="https://wa.me/918500000811" rel="noopener noreferrer" target="_blank">

    <span id="chat-label">WhatsApp</span>
  </a>
  <div class="modal" id="modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" type="button">Close</button>
      <div class="modal-layout">
        <div class="modal-visual">
          <div class="modal-photo" id="modal-photo"></div>
          <p class="photo-note" id="modal-photo-note" hidden></p>
        </div>
        <div class="modal-body">
          <h2 id="modal-title"></h2>
          <p class="modal-price" id="modal-price"></p>
          <p class="modal-blurb" id="modal-blurb" hidden></p>
          <div class="swatches" id="modal-swatches"></div>
          <form id="modal-form" novalidate>
            <div id="modal-alert" class="form-alert" role="alert" hidden></div>
            <div class="field">
              <p class="size-label" id="modal-size-label">Size</p>
              <div id="modal-size-group" class="size-group" role="radiogroup" aria-labelledby="modal-size-label" tabindex="-1"></div>
              <p class="field-error" id="modal-error-size" hidden></p>
            </div>
            <div class="field">
              <label id="modal-label-quantity" for="modal-quantity">Quantity</label>
              <input id="modal-quantity" type="number" inputmode="numeric" min="1" max="10" step="1" value="1">
              <p class="field-error" id="modal-error-quantity" hidden></p>
            </div>
            <div class="field">
              <label id="modal-label-name" for="modal-name">Name</label>
              <input id="modal-name" autocomplete="name">
              <p class="field-error" id="modal-error-name" hidden></p>
            </div>
            <div class="field">
              <label id="modal-label-city" for="modal-city">City</label>
              <input id="modal-city" autocomplete="address-level2">
              <p class="field-error" id="modal-error-city" hidden></p>
            </div>
            <div class="field">
              <label id="modal-label-pincode" for="modal-pincode">Pincode</label>
              <input id="modal-pincode" inputmode="numeric" autocomplete="postal-code" maxlength="6">
              <p class="field-error" id="modal-error-pincode" hidden></p>
            </div>
            <div class="field">
              <label id="modal-label-source" for="modal-source">Where did you hear about us?</label>
              <select id="modal-source">
                <option value="">Choose one</option>
              </select>
              <p class="field-error" id="modal-error-source" hidden></p>
            </div>
            <div class="field">
              <label id="modal-label-note" for="modal-note">Note (optional)</label>
              <textarea id="modal-note"></textarea>
              <p class="field-error" id="modal-error-note" hidden></p>
            </div>
            <p class="each-price" id="modal-each"></p>
            <div class="total-bar">
              <span id="modal-total-label">Total</span>
              <strong id="modal-total">₹—</strong>
            </div>
            <button class="btn" type="submit" id="modal-submit">Order on WhatsApp</button>
            <p class="sent-note" id="modal-sent" hidden></p>
            <a class="fallback" id="modal-fallback" hidden rel="noopener noreferrer" target="_blank">Open WhatsApp with this order</a>
          </form>
        </div>
      </div>
    </div>
  </div>
  <noscript>
    <p class="catalog-message wrap">This shop needs JavaScript to show the tees and to open WhatsApp.</p>
  </noscript>
  <script src="content.js"></script>
  <script src="shop.js"></script>
  <script src="app.js"></script>
</body>
